# NATS Server — single-node, JetStream on the /data volume.
# Proven config (nats:2-alpine, NATS 2.x): single Go binary, no privileged/socat.
#
# Ports:
#   4222  client (NATS protocol)      -> expose via RAILWAY_PRIVATE_DOMAIN
#   8222  monitor / HTTP API (health) -> expose via public domain (health = / returns 200)
#   6222  cluster (reserved for future multi-node)
#
# The monitor API (8222) is bound to all interfaces by NATS default, so the
# public domain (target port 8222) reaches the health/status endpoints:
#   GET /        -> status page (200)  [health check]
#   GET /jsz     -> JetStream usage   (200)
#   GET /varz    -> server config     (200)
# The 4222 client port itself has NO HTTP surface — clients speak the NATS binary
# protocol (nats CLI / nats.go / nats.py / etc.) over the private domain.

server_name: "nats-railway"

port: 4222
monitor_port: 8222

# JetStream persistent store on the /data volume (actual store dir: /data/jetstream).
jetstream {
  store_dir: "/data"
}
